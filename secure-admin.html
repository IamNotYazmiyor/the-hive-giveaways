<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title><style>html,body{margin:0;min-height:100%;background:#080b0e;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:460px;margin:80px auto;padding:24px}.box{background:#11161a;border:1px solid #303840;padding:30px}.status{padding:10px;background:#182126;color:#f4c542;margin-bottom:20px;font-size:13px}label{display:block;font-size:12px;font-weight:bold;margin:16px 0 7px}input{display:block;width:100%;box-sizing:border-box;padding:15px;background:#090c0f;color:#fff;border:1px solid #46515a;font-size:16px}button{display:block;width:100%;padding:16px;margin-top:22px;background:#f4c542;color:#111;border:0;font-weight:900;font-size:16px;cursor:pointer;position:relative;z-index:9999}.msg{min-height:24px;margin-top:16px}.err{color:#ff6870}.ok{color:#83e69a}h1{font-size:42px;margin:8px 0 20px}</style></head><body><div class="wrap"><div class="box"><div id="status" class="status">PAGE LOADED • JavaScript test pending…</div><h1>ADMIN LOGIN</h1><p>Authorized accounts only.</p><form id="loginForm"><label for="email">EMAIL</label><input id="email" type="email" autocomplete="username" required><label for="password">PASSWORD</label><input id="password" type="password" autocomplete="current-password" required><button id="loginBtn" type="submit">SIGN IN →</button></form><div id="msg" class="msg"></div></div></div><script>document.getElementById("status").textContent="JAVASCRIPT ACTIVE • BUTTON READY";document.getElementById("loginForm").addEventListener("submit",async function(e){e.preventDefault();const b=document.getElementById("loginBtn"),m=document.getElementById("msg"),email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;b.disabled=true;b.textContent="SIGNING IN…";m.className="msg";m.textContent="Connecting to Supabase…";try{const r=await fetch("https://adgfwvqndgwdllnjtbcc.supabase.co/auth/v1/token?grant_type=password",{method:"POST",headers:{"Content-Type":"application/json","apikey":"sb_publishable_ZgCi1NpFMv9KcDGdZlEfdg_0aHBMs7J"},body:JSON.stringify({email,password})});const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.msg||"Login failed");sessionStorage.setItem("hive_admin_access",j.access_token);m.className="msg ok";m.textContent="Supabase login successful. Admin session created.";setTimeout(()=>location.href="admin-dashboard.html",500)}catch(err){m.className="msg err";m.textContent=err.message||"Login failed"}finally{b.disabled=false;b.textContent="SIGN IN →"}});</script></body></html>
