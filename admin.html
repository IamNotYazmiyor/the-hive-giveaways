<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yazmiyor Giveaways • Admin</title><link rel="stylesheet" href="style.css"><style>body{background:#080b0d;color:#f4f5f6}.admin{max-width:1050px;margin:auto;padding:50px 20px}.box{max-width:440px;margin:9vh auto;background:#11161a;border:1px solid #293137;padding:28px}.box h1{font-size:42px;margin:8px 0 25px}.field{margin:14px 0}.field label{display:block;margin-bottom:7px;font-weight:700}.field input{width:100%;padding:13px;background:#090c0f;border:1px solid #384149;color:#fff;box-sizing:border-box}.btn{width:100%;padding:14px;border:0;background:#ffc928;color:#111;font-weight:900;cursor:pointer;margin-top:10px}.btn:disabled{opacity:.6;cursor:wait}.msg{min-height:24px;margin-top:15px;line-height:1.45}.err{color:#ff7777}.ok{color:#86e59a}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.small{width:auto;padding:10px 15px}.hidden{display:none!important}.cards{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:25px 0}.card{background:#11161a;border:1px solid #293137;padding:22px}.num{font-size:48px;font-weight:900;color:#ffc928}.tablebox{overflow:auto;background:#11161a;border:1px solid #293137;padding:15px;margin-top:15px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #293137;text-align:left;font-size:13px}th{color:#9da6ad}@media(max-width:650px){.cards{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><header class="nav"><a class="brand" href="index.html">◆ YAZMIYOR <b>ADMIN</b></a></header><main class="admin"><section id="loginBox" class="box"><div class="eyebrow">PRIVATE ADMIN AREA</div><h1>ADMIN LOGIN</h1><p>Authorized accounts only.</p><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn" class="btn" type="button">SIGN IN →</button><div id="msg" class="msg">JavaScript status: loading…</div></section><section id="panel" class="hidden"><div class="top"><div><div class="eyebrow">CONTROL CENTER</div><h1>GIVEAWAY ADMIN</h1></div><button id="logoutBtn" class="btn small" type="button">LOG OUT</button></div><div class="cards"><div class="card">GIVEAWAYS<div id="gnum" class="num">0</div></div><div class="card">ENTRIES<div id="enum" class="num">0</div></div></div><div class="tablebox"><h2>Giveaways</h2><table><thead><tr><th>Title</th><th>Status</th><th>Ends</th><th>Entries</th></tr></thead><tbody id="grow"></tbody></table></div><div class="tablebox"><h2>Entries</h2><table><thead><tr><th>Minecraft Nick</th><th>Contact</th><th>Status</th><th>Created</th></tr></thead><tbody id="erow"></tbody></table></div></section></main><script src="admin.js?v=7"></script></body></html>
