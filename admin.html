<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yazmiyor • Admin</title><link rel="stylesheet" href="style.css"><style>
.admin-wrap{max-width:1180px;margin:0 auto;padding:50px 24px}.login{max-width:430px;margin:10vh auto}.panel{background:var(--panel);border:1px solid var(--line);padding:25px;margin-bottom:18px}.dash{display:grid;grid-template-columns:1fr 2fr;gap:18px}.stat{font:800 55px 'Barlow Condensed';color:var(--accent)}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-size:10px;text-transform:uppercase}.danger{color:var(--danger)}.muted{color:var(--muted)}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.smallbtn{border:1px solid var(--line);background:#0b0f12;color:var(--text);padding:9px 12px;cursor:pointer}.smallbtn.primary{background:var(--accent);color:#111;border-color:var(--accent);font-weight:800}.reqs{color:var(--muted);padding-left:18px}.notice{background:#17140b;border:1px solid #4d411d;padding:15px;color:#d8c986;font-size:12px;line-height:1.6}.admin-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}@media(max-width:800px){.dash,.admin-grid{grid-template-columns:1fr}.admin-wrap{padding:30px 16px}}
</style></head><body><header class="nav"><a class="brand" href="index.html"><span class="cube">◆</span> YAZMIYOR <b>ADMIN</b></a><div><button class="smallbtn" id="logout">Logout</button></div></header>
<main class="admin-wrap"><section id="loginView" class="login panel"><div class="eyebrow">PRIVATE AREA</div><h1 style="font:800 58px 'Barlow Condensed';margin:10px 0">ADMIN LOGIN</h1><p class="muted">Only authorized administrators can access giveaway data.</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><button class="submit" id="login">SIGN IN →</button><p id="loginMsg" class="danger"></p></section>
<section id="appView" hidden><div class="toolbar"><div><div class="eyebrow">CONTROL CENTER</div><h1 style="font:800 58px 'Barlow Condensed';margin:8px 0 25px">GIVEAWAY ADMIN</h1></div><button class="smallbtn primary" id="newBtn">+ NEW GIVEAWAY</button></div>
<div id="bootstrap" class="notice" hidden></div>
<div class="dash"><div class="panel"><div class="muted">GIVEAWAYS</div><div id="gCount" class="stat">0</div></div><div class="panel"><div class="muted">ENTRIES</div><div id="eCount" class="stat">0</div></div></div>
<div class="panel"><div class="toolbar"><h2>Giveaways</h2><button class="smallbtn" id="refresh">Refresh</button></div><div style="overflow:auto"><table><thead><tr><th>Title</th><th>Status</th><th>Ends</th><th>Entries</th><th>Actions</th></tr></thead><tbody id="giveawayRows"></tbody></table></div></div>
<div class="panel"><h2>Entries</h2><div style="overflow:auto"><table><thead><tr><th>Nick</th><th>Contact</th><th>Giveaway</th><th>Status</th><th>Time</th><th></th></tr></thead><tbody id="entryRows"></tbody></table></div></div>
</section></main>
<div id="modal" class="modal hidden"><div class="modal-box"><button class="close" id="mclose">×</button><div id="mcontent"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js"></script></body></html>
