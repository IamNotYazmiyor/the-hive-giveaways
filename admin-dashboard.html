<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yazmiyor Admin Dashboard</title>
<style>
body{margin:0;background:#080b0e;color:#fff;font-family:Arial,sans-serif}
main{max-width:1100px;margin:50px auto;padding:20px}
header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #293137;padding-bottom:20px}
h1{font-size:42px;margin:8px 0}.eyebrow{color:#f4c542;font-weight:800;letter-spacing:2px;font-size:12px}
button{background:#f4c542;color:#111;border:0;padding:12px 18px;font-weight:800;cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:30px}
.card{background:#11161a;border:1px solid #293137;padding:24px}.num{font-size:50px;color:#f4c542;font-weight:900;margin-top:10px}
.msg{margin-top:25px;color:#aeb8bf}.err{color:#ff7078}
@media(max-width:650px){.cards{grid-template-columns:1fr}header{align-items:flex-start;gap:15px;flex-direction:column}}
</style>
</head>
<body>
<main>
<header><div><div class="eyebrow">PRIVATE CONTROL CENTER</div><h1>GIVEAWAY ADMIN</h1></div><button id="logout">LOG OUT</button></header>
<div id="msg" class="msg">Checking admin session…</div>
<div class="cards">
<div class="card">GIVEAWAYS<div id="g" class="num">—</div></div>
<div class="card">ENTRIES<div id="e" class="num">—</div></div>
</div>
</main>
<script>
const URL="https://adgfwvqndgwdllnjtbcc.supabase.co";
const KEY="sb_publishable_ZgCi1NpFMv9KcDGdZlEfdg_0aHBMs7J";
const token=sessionStorage.getItem("hive_admin_access");
const msg=document.getElementById("msg");
document.getElementById("logout").onclick=()=>{sessionStorage.removeItem("hive_admin_access");location.href="admin.html"};
if(!token){msg.className="msg err";msg.textContent="No admin session. Returning to login…";setTimeout(()=>location.href="admin.html",1000)}
else{
fetch(URL+"/functions/v1/admin-api",{method:"POST",headers:{"Content-Type":"application/json","apikey":KEY,"Authorization":"Bearer "+token},body:JSON.stringify({action:"list"})})
.then(async r=>{const text=await r.text();let d={};try{d=JSON.parse(text)}catch{}if(!r.ok)throw new Error(d.error||"Admin access denied ("+r.status+")");document.getElementById("g").textContent=(d.giveaways||[]).length;document.getElementById("e").textContent=(d.entries||[]).length;msg.textContent="Admin access verified."})
.catch(err=>{sessionStorage.removeItem("hive_admin_access");msg.className="msg err";msg.textContent=err.message;setTimeout(()=>location.href="admin.html",1800)})
}
</script>
</body>
</html>
